<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Portfolio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            line-height: 1.6;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        h1, h2, h3 {
            color: #fff;
            margin-bottom: 20px;
        }
        .section {
            background: #111;
            border: 1px solid #222;
            border-radius: 8px;
            padding: 30px;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #aaa;
            font-size: 14px;
        }
        input[type="text"],
        input[type="email"],
        input[type="password"],
        textarea,
        select {
            width: 100%;
            padding: 12px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 4px;
            color: #fff;
            font-size: 14px;
        }
        input[type="text"]:focus,
        textarea:focus {
            outline: none;
            border-color: #00d4ff;
        }
        button {
            background: #00d4ff;
            color: #000;
            border: none;
            padding: 12px 24px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s;
        }
        button:hover {
            background: #00b8e6;
            transform: translateY(-2px);
        }
        button.danger {
            background: #ff4444;
            color: #fff;
        }
        button.danger:hover {
            background: #ff3333;
        }
        button.secondary {
            background: #333;
            color: #fff;
        }
        button.secondary:hover {
            background: #444;
        }
        .item-list {
            margin-top: 20px;
        }
        .item {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 4px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .item-info h4 {
            color: #fff;
            margin-bottom: 5px;
        }
        .item-info p {
            color: #888;
            font-size: 14px;
        }
        .item-actions {
            display: flex;
            gap: 10px;
        }
        .btn-small {
            padding: 6px 12px;
            font-size: 12px;
        }
        .login-form {
            max-width: 400px;
            margin: 100px auto;
        }
        .hidden {
            display: none;
        }
        .alert {
            padding: 12px 20px;
            border-radius: 4px;
            margin-bottom: 20px;
        }
        .alert-success {
            background: #1a3a1a;
            border: 1px solid #2d5a2d;
            color: #4ade80;
        }
        .alert-error {
            background: #3a1a1a;
            border: 1px solid #5a2d2d;
            color: #f87171;
        }
        .upload-area {
            border: 2px dashed #333;
            border-radius: 8px;
            padding: 40px;
            text-align: center;
            margin-top: 20px;
            transition: all 0.3s;
        }
        .upload-area:hover {
            border-color: #00d4ff;
            background: #1a1a2a;
        }
        .upload-area.dragover {
            border-color: #00d4ff;
            background: #1a1a3a;
        }
        .image-preview {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        .image-item {
            position: relative;
            aspect-ratio: 1;
            border-radius: 4px;
            overflow: hidden;
        }
        .image-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .image-item .remove {
            position: absolute;
            top: 5px;
            right: 5px;
            background: rgba(255, 0, 0, 0.8);
            color: #fff;
            border: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 1px solid #333;
        }
        .tab {
            padding: 12px 24px;
            background: none;
            border: none;
            color: #888;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
        }
        .tab.active {
            color: #00d4ff;
            border-bottom-color: #00d4ff;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-content {
            background: #111;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 30px;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .modal-header h3 {
            margin: 0;
        }
        .close-modal {
            background: none;
            border: none;
            color: #888;
            font-size: 24px;
            cursor: pointer;
            padding: 0;
            width: 32px;
            height: 32px;
        }
        .close-modal:hover {
            color: #fff;
            background: none;
            transform: none;
        }
    </style>
</head>
<body>
    <!-- Login -->
    <div id="loginSection" class="container">
        <div class="section login-form">
            <h2>Admin Login</h2>
            <div id="loginAlert"></div>
            <div class="form-group">
                <label>GitHub Username</label>
                <input type="text" id="githubUsername" placeholder="vdmtx">
            </div>
            <div class="form-group">
                <label>GitHub Token (Personal Access Token)</label>
                <input type="password" id="githubToken" placeholder="ghp_...">
            </div>
            <button onclick="login()">Acessar Painel</button>
            <p style="margin-top: 20px; font-size: 14px; color: #666;">
                Crie um token em: <a href="https://github.com/settings/tokens" target="_blank" style="color: #00d4ff;">GitHub Settings</a>
            </p>
        </div>
    </div>

    <!-- Admin Panel -->
    <div id="adminPanel" class="container hidden">
        <h1>Painel Administrativo</h1>
        
        <div class="tabs">
            <button class="tab active" onclick="switchTab('competencies')">Competências</button>
            <button class="tab" onclick="switchTab('cases')">Cases</button>
            <button class="tab" onclick="switchTab('images')">Imagens</button>
        </div>

        <!-- Competencies Tab -->
        <div id="competenciesTab" class="tab-content active">
            <div class="section">
                <h2>Gerenciar Competências</h2>
                <div id="competenciesAlert"></div>
                
                <div class="form-group">
                    <label>Título</label>
                    <input type="text" id="compTitle" placeholder="Ex: Visual Identity Engineering">
                </div>
                <div class="form-group">
                    <label>Descrição</label>
                    <textarea id="compDescription" rows="4" placeholder="Descrição da competência..."></textarea>
                </div>
                <button onclick="addCompetency()">Adicionar Competência</button>

                <div class="item-list" id="competenciesList"></div>
            </div>
        </div>

        <!-- Cases Tab -->
        <div id="casesTab" class="tab-content">
            <div class="section">
                <h2>Gerenciar Cases</h2>
                <div id="casesAlert"></div>
                
                <div class="form-group">
                    <label>Título</label>
                    <input type="text" id="caseTitle" placeholder="Ex: Coisa Mais Linda">
                </div>
                <div class="form-group">
                    <label>Categoria</label>
                    <input type="text" id="caseCategory" placeholder="Ex: Retail & Fashion">
                </div>
                <div class="form-group">
                    <label>Slug (URL amigável)</label>
                    <input type="text" id="caseSlug" placeholder="Ex: coisamaislinda">
                </div>
                <button onclick="addCase()">Adicionar Case</button>

                <div class="item-list" id="casesList"></div>
            </div>
        </div>

        <!-- Images Tab -->
        <div id="imagesTab" class="tab-content">
            <div class="section">
                <h2>Gerenciar Imagens dos Cases</h2>
                <div id="imagesAlert"></div>
                
                <div class="form-group">
                    <label>Selecionar Case</label>
                    <select id="caseSelect"></select>
                </div>

                <div class="upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click()">
                    <p>Arraste imagens aqui ou clique para selecionar</p>
                    <input type="file" id="fileInput" multiple accept="image/*" style="display: none" onchange="handleFiles(this.files)">
                </div>

                <div class="image-preview" id="imagePreview"></div>
                
                <div style="margin-top: 20px;">
                    <button onclick="uploadImages()">Enviar Imagens</button>
                </div>

                <div class="item-list" id="currentImagesList" style="margin-top: 30px;">
                    <h3>Imagens Atuais</h3>
                </div>
            </div>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
