<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — VDMTX</title>
    
    <!-- ============================================ -->
    <!-- ESTILOS VISUAIS (CSS) - aparência da página  -->
    <!-- ============================================ -->
    <style>
        /* Reset básico: remove margens padrão do navegador */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        /* Estilo geral do corpo da página */
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;      /* Fundo escuro */
            color: #e0e0e0;           /* Texto claro */
            padding: 40px 20px;
        }
        
        .container { max-width: 1000px; margin: 0 auto; }
        h1 { color: #fff; margin-bottom: 30px; font-size: 28px; }
        
        /* Sistema de abas (Competências / Cases / Imagens) */
        .tabs {
            display: flex;
            gap: 0;
            margin-bottom: 30px;
            border-bottom: 1px solid #333;
        }
        .tab {
            padding: 12px 24px;
            background: none;
            border: none;
            color: #888;
            cursor: pointer;
            font-size: 14px;
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
        }
        .tab.active {
            color: #00d4ff;
            border-bottom-color: #00d4ff;
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        /* Caixas de conteúdo (cada seção) */
        .section {
            background: #111;
            border: 1px solid #222;
            border-radius: 8px;
            padding: 30px;
            margin-bottom: 30px;
        }
        h2 { color: #fff; margin-bottom: 20px; font-size: 20px; }
        
        /* Labels e campos de formulário */
        label { display: block; margin-bottom: 8px; color: #aaa; font-size: 14px; }
        input, textarea, select {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 4px;
            color: #fff;
            font-size: 14px;
            font-family: inherit;
        }
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #00d4ff;
        }
        textarea { resize: vertical; min-height: 100px; }
        
        /* Botões */
        button {
            padding: 12px 24px;
            font-size: 14px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
        }
        .btn-primary { background: #00d4ff; color: #000; }
        .btn-primary:hover { background: #00b8e6; }
        .btn-secondary { background: #333; color: #fff; }
        .btn-secondary:hover { background: #444; }
        .btn-danger { background: #ff4444; color: #fff; }
        .btn-danger:hover { background: #ff3333; }
        
        /* Lista de itens (competências e cases) */
        .item {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 4px;
            padding: 20px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .item-info h3 { color: #fff; font-size: 16px; margin-bottom: 5px; }
        .item-info p { color: #888; font-size: 13px; }
        
        /* Mensagens de alerta (sucesso/erro) */
        .alert {
            padding: 12px 20px;
            border-radius: 4px;
            margin-bottom: 20px;
            font-size: 14px;
        }
        .alert-success { background: #1a3a1a; color: #4ade80; border: 1px solid #2d5a2d; }
        .alert-error { background: #3a1a1a; color: #f87171; border: 1px solid #5a2d2d; }
        
        /* Formulário de login */
        .login-form { max-width: 500px; margin: 100px auto; }
        .hidden { display: none; }
        
        /* Área de upload de imagens */
        .upload-area {
            border: 2px dashed #333;
            border-radius: 8px;
            padding: 60px 40px;
            text-align: center;
            margin: 30px 0;
            cursor: pointer;
            transition: all 0.3s;
        }
        .upload-area:hover { border-color: #00d4ff; background: #1a1a2a; }
        
        /* Preview das imagens antes de enviar */
        .image-preview {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
            margin: 30px 0;
        }
        .image-item {
            position: relative;
            aspect-ratio: 1;
            border-radius: 4px;
            overflow: hidden;
        }
        .image-item img { width: 100%; height: 100%; object-fit: cover; }
        .image-item button {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: rgba(255,0,0,0.8);
            color: #fff;
            border: none;
            cursor: pointer;
            font-size: 16px;
            padding: 0;
        }
        
        /* Galeria de imagens existentes (com numeração e botões ↑↓) */
        .gallery-item {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 12px;
            position: relative;
        }
        .gallery-number {
            position: absolute;
            top: -8px;
            left: -8px;
            background: #00d4ff;
            color: #000;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 13px;
            z-index: 2;
        }
        .gallery-info {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <!-- ============================================ -->
    <!-- TELA DE LOGIN (aparece primeiro)             -->
    <!-- ============================================ -->
    <div id="loginSection" class="container">
        <div class="login-form">
            <h1>Admin Login</h1>
            <div id="loginAlert"></div>
            <label>GitHub Username</label>
            <input type="text" id="githubUsername" placeholder="vdmtx">
            <label>GitHub Token</label>
            <input type="password" id="githubToken" placeholder="ghp_...">
            <button class="btn-primary" onclick="login()">Acessar Painel</button>
            <p style="margin-top:20px;font-size:13px;color:#666;">
                Crie um token em: <a href="https://github.com/settings/tokens" target="_blank" style="color:#00d4ff;">GitHub Settings</a>
            </p>
        </div>
    </div>

    <!-- ============================================ -->
    <!-- PAINEL ADMINISTRATIVO (aparece após login)  -->
    <!-- ============================================ -->
    <div id="adminPanel" class="container hidden">
        <h1>Painel Administrativo</h1>
        
        <!-- Abas de navegação -->
        <div class="tabs">
            <button class="tab active" onclick="switchTab('competencies', this)">Competências</button>
            <button class="tab" onclick="switchTab('cases', this)">Cases</button>
            <button class="tab" onclick="switchTab('images', this)">Imagens</button>
        </div>

        <!-- ABA 1: COMPETÊNCIAS -->
        <div id="competenciesTab" class="tab-content active">
            <div class="section">
                <h2>Gerenciar Competências</h2>
                <div id="competenciesAlert"></div>
                <label>Título</label>
                <input type="text" id="compTitle" placeholder="Ex: Visual Identity Engineering">
                <label>Descrição</label>
                <textarea id="compDescription" placeholder="Descrição da competência..."></textarea>
                <button class="btn-primary" onclick="addCompetency()">Adicionar Competência</button>
                <div id="competenciesList" style="margin-top:30px;"></div>
            </div>
        </div>

        <!-- ABA 2: CASES -->
        <div id="casesTab" class="tab-content">
            <div class="section">
                <h2>Gerenciar Cases</h2>
                <div id="casesAlert"></div>
                <label>Título</label>
                <input type="text" id="caseTitle" placeholder="Ex: Coisa Mais Linda">
                <label>Categoria</label>
                <input type="text" id="caseCategory" placeholder="Ex: Visual Identity & Retail Strategy">
                <label>Slug (URL amigável)</label>
                <input type="text" id="caseSlug" placeholder="Ex: coisamaislinda">
                <button class="btn-primary" onclick="addCase()">Adicionar Case</button>
                <div id="casesList" style="margin-top:30px;"></div>
            </div>
        </div>

        <!-- ABA 3: IMAGENS -->
        <div id="imagesTab" class="tab-content">
            <div class="section">
                <h2>Gerenciar Imagens</h2>
                <div id="imagesAlert"></div>
                <label>Selecionar Case</label>
                <select id="caseSelect"><option value="">Selecione um case...</option></select>
                
                <!-- Área de upload -->
                <div class="upload-area" id="uploadArea">
                    <p style="color:#888;font-size:14px;">Clique ou arraste imagens aqui</p>
                    <input type="file" id="fileInput" multiple accept="image/*" style="display:none">
                </div>
                
                <!-- Preview das imagens selecionadas -->
                <div class="image-preview" id="imagePreview"></div>
                <button class="btn-primary" id="uploadBtn" style="display:none;" onclick="uploadImages()">Enviar Imagens</button>
                
                <!-- Galeria das imagens já enviadas (com ordenação) -->
                <div id="currentImages" style="margin-top:40px;">
                    <h3 style="color:#fff;margin-bottom:15px;">Imagens do Case</h3>
                    <p style="color:#666;font-size:13px;margin-bottom:20px;">Use os botões ↑ ↓ para reordenar.</p>
                    <div id="galleryGrid" class="gallery-grid"></div>
                    <button class="btn-primary" id="saveOrderBtn" style="display:none;margin-top:20px;" onclick="saveImageOrder()">Salvar Ordem</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ============================================ -->
    <!-- LÓGICA DO PAINEL (JavaScript)                -->
    <!-- ============================================ -->
    <script>
        // Variáveis globais - guardam o estado do painel
        var config = { username: '', token: '', repo: 'art-director-portfolio', branch: 'main' };
        var currentData = { competencies: [], cases: [] };  // dados do config.json
        var selectedCase = null;      // case selecionado na aba imagens
        var filesToUpload = [];       // arquivos prontos para upload
        var imageOrder = [];          // ordem atual das imagens
        var allCaseImages = [];       // todas as imagens do case atual

        // ==========================================
        // FUNÇÃO: login() - valida o token e entra
        // ==========================================
        async function login() {
            var username = document.getElementById('githubUsername').value.trim();
            var token = document.getElementById('githubToken').value.trim();

            if (!username || !token) {
                showAlert('loginAlert', 'Preencha username e token', 'error');
                return;
            }

            config.username = username;
            config.token = token;

            try {
                // Testa se o token é válido chamando a API do GitHub
                var testRes = await fetch('https://api.github.com/user', {
                    headers: { 'Authorization': 'token ' + config.token, 'Accept': 'application/vnd.github.v3+json' }
                });

                if (!testRes.ok) throw new Error('Token inválido (' + testRes.status + ')');

                var user = await testRes.json();
                console.log('Token válido para:', user.login);

                // Carrega (ou cria) o arquivo config.json
                await loadOrCreateConfig();

                // Esconde login e mostra o painel
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('adminPanel').classList.remove('hidden');

                // Carrega as listas
                loadCompetencies();
                loadCases();
                updateCaseSelect();

                showAlert('loginAlert', 'Login realizado com sucesso!', 'success');
            } catch (error) {
                console.error('Erro no login:', error);
                var msg = 'Erro: ' + error.message;
                if (error.message.includes('401')) msg = 'Token inválido. Verifique permissão "repo".';
                else if (error.message.includes('403')) msg = 'Acesso negado. Token precisa de permissão "repo".';
                else if (error.message.includes('404')) msg = 'Repositório não encontrado.';
                showAlert('loginAlert', msg, 'error');
            }
        }

        // ==========================================
        // FUNÇÃO: loadOrCreateConfig() - carrega ou cria o config.json
        // ==========================================
        async function loadOrCreateConfig() {
            var url = 'https://api.github.com/repos/' + config.username + '/' + config.repo + '/contents/config.json';

            try {
                var res = await fetch(url + '?ref=' + config.branch, {
                    headers: { 'Authorization': 'token ' + config.token, 'Accept': 'application/vnd.github.v3+json' }
                });

                if (res.ok) {
                    var data = await res.json();
                    // Decodifica o conteúdo (GitHub envia em base64)
                    currentData = JSON.parse(atob(data.content));
                    console.log('Config carregado:', currentData);
                    return;
                }
            } catch (e) {
                console.log('Config não existe, criando...');
            }

            // Se não existe, cria um config inicial
            currentData = {
                competencies: [{ title: 'Visual Identity Engineering', description: 'Brand design focused on longevity.' }],
                cases: []
            };

            await saveConfig();
            console.log('Config inicial criado!');
        }

        // ==========================================
        // FUNÇÃO: saveConfig() - salva o config.json no GitHub
        // IMPORTANTE: sempre busca o SHA mais recente para evitar conflito
        // ==========================================
        async function saveConfig() {
            var url = 'https://api.github.com/repos/' + config.username + '/' + config.repo + '/contents/config.json?ref=' + config.branch;
            
            // Busca o SHA atual (obrigatório para atualizar)
            var getRes = await fetch(url, {
                headers: { 
                    'Authorization': 'token ' + config.token, 
                    'Accept': 'application/vnd.github.v3+json' 
                }
            });
            
            if (!getRes.ok) {
                throw new Error('Não foi possível obter o SHA atual do config.json');
            }
            
            var getData = await getRes.json();
            var currentSha = getData.sha;
            
            console.log('SHA atual:', currentSha);
            
            // Codifica o conteúdo em base64 (formato que o GitHub exige)
            var body = {
                message: 'Update config via admin - ' + new Date().toISOString(),
                content: btoa(unescape(encodeURIComponent(JSON.stringify(currentData, null, 2)))),
                branch: config.branch,
                sha: currentSha
            };

            var putRes = await fetch('https://api.github.com/repos/' + config.username + '/' + config.repo + '/contents/config.json', {
                method: 'PUT',
                headers: { 
                    'Authorization': 'token ' + config.token, 
                    'Accept': 'application/vnd.github.v3+json', 
                    'Content-Type': 'application/json' 
                },
                body: JSON.stringify(body)
            });

            if (!putRes.ok) {
                var err = await putRes.json();
                throw new Error(err.message || 'Falha ao salvar');
            }
            
            console.log('Config salvo com sucesso!');
        }

        // ==========================================
        // FUNÇÃO: loadCompetencies() - exibe a lista de competências
        // ==========================================
        function loadCompetencies() {
            var list = document.getElementById('competenciesList');
            if (currentData.competencies.length === 0) {
                list.innerHTML = '<p style="color:#999;padding:20px;">Nenhuma competência</p>';
                return;
            }

            list.innerHTML = currentData.competencies.map(function(comp, i) {
                return '<div class="item"><div class="item-info"><h3>' + comp.title + '</h3><p>' + comp.description + '</p></div>' +
                    '<button class="btn-danger" onclick="deleteCompetency(' + i + ')">Remover</button></div>';
            }).join('');
        }

        // ==========================================
        // FUNÇÃO: addCompetency() - adiciona uma nova competência
        // ==========================================
        async function addCompetency() {
            var title = document.getElementById('compTitle').value.trim();
            var desc = document.getElementById('compDescription').value.trim();

            if (!title || !desc) {
                showAlert('competenciesAlert', 'Preencha título e descrição', 'error');
                return;
            }

            currentData.competencies.push({ title: title, description: desc });

            try {
                await saveConfig();
                document.getElementById('compTitle').value = '';
                document.getElementById('compDescription').value = '';
                loadCompetencies();
                showAlert('competenciesAlert', 'Competência adicionada!', 'success');
            } catch (error) {
                showAlert('competenciesAlert', 'Erro: ' + error.message, 'error');
            }
        }

        // ==========================================
        // FUNÇÃO: deleteCompetency() - remove uma competência
        // ==========================================
        async function deleteCompetency(index) {
            if (!confirm('Confirmar?')) return;
            currentData.competencies.splice(index, 1);
            try {
                await saveConfig();
                loadCompetencies();
                showAlert('competenciesAlert', 'Removido!', 'success');
            } catch (e) {
                showAlert('competenciesAlert', 'Erro', 'error');
            }
        }

        // ==========================================
        // FUNÇÃO: loadCases() - exibe a lista de cases
        // ==========================================
        function loadCases() {
            var list = document.getElementById('casesList');
            if (currentData.cases.length === 0) {
                list.innerHTML = '<p style="color:#999;padding:20px;">Nenhum case</p>';
                return;
            }

            list.innerHTML = currentData.cases.map(function(c, i) {
                return '<div class="item"><div class="item-info"><h3>' + c.title + '</h3><p>' + c.category + ' — ' + c.folder + '</p></div>' +
                    '<div><button class="btn-secondary" onclick="viewCaseImages(' + i + ')">Imagens</button> ' +
                    '<button class="btn-danger" onclick="deleteCase(' + i + ')">Remover</button></div></div>';
            }).join('');
        }

        // ==========================================
        // FUNÇÃO: addCase() - adiciona um novo case (e cria a pasta no GitHub)
        // ==========================================
        async function addCase() {
            var title = document.getElementById('caseTitle').value.trim();
            var category = document.getElementById('caseCategory').value.trim();
            var slug = document.getElementById('caseSlug').value.trim().toLowerCase().replace(/\s+/g, '-');

            if (!title || !slug) {
                showAlert('casesAlert', 'Preencha título e slug', 'error');
                return;
            }

            var folder = 'img/' + slug;
            currentData.cases.push({ slug: slug, title: title, category: category || 'General', folder: folder });

            try {
                // Cria a pasta no GitHub (adicionando um arquivo .gitkeep vazio)
                var folderUrl = 'https://api.github.com/repos/' + config.username + '/' + config.repo + '/contents/' + folder + '/.gitkeep';
                await fetch(folderUrl, {
                    method: 'PUT',
                    headers: { 'Authorization': 'token ' + config.token, 'Accept': 'application/vnd.github.v3+json' },
                    body: JSON.stringify({ message: 'Create ' + folder, content: '', branch: config.branch })
                });

                await saveConfig();
                document.getElementById('caseTitle').value = '';
                document.getElementById('caseCategory').value = '';
                document.getElementById('caseSlug').value = '';
                loadCases();
                updateCaseSelect();
                showAlert('casesAlert', 'Case adicionado!', 'success');
            } catch (error) {
                showAlert('casesAlert', 'Erro: ' + error.message, 'error');
            }
        }

        // ==========================================
        // FUNÇÃO: deleteCase() - remove um case
        // ==========================================
        async function deleteCase(index) {
            if (!confirm('Confirmar?')) return;
            currentData.cases.splice(index, 1);
            try {
                await saveConfig();
                loadCases();
                updateCaseSelect();
                showAlert('casesAlert', 'Case removido!', 'success');
            } catch (e) {
                showAlert('casesAlert', 'Erro', 'error');
            }
        }

        // ==========================================
        // FUNÇÃO: updateCaseSelect() - atualiza o dropdown de cases na aba imagens
        // ==========================================
        function updateCaseSelect() {
            var select = document.getElementById('caseSelect');
            select.innerHTML = '<option value="">Selecione...</option>' +
                currentData.cases.map(function(c, i) { return '<option value="' + i + '">' + c.title + '</option>'; }).join('');

            select.onchange = function(e) {
                if (e.target.value) {
                    selectedCase = currentData.cases[e.target.value];
                    loadCaseImages();
                }
            };
        }

        // ==========================================
        // FUNÇÃO: loadCaseImages() - carrega as imagens do case selecionado
        // ==========================================
        async function loadCaseImages() {
            if (!selectedCase) return;
            
            var grid = document.getElementById('galleryGrid');
            var saveBtn = document.getElementById('saveOrderBtn');
            grid.innerHTML = '<p style="color:#888;">Carregando...</p>';
            saveBtn.style.display = 'none';

            try {
                var url = 'https://api.github.com/repos/' + config.username + '/' + config.repo + '/contents/' + selectedCase.folder;
                var res = await fetch(url, {
                    headers: { 'Authorization': 'token ' + config.token, 'Accept': 'application/vnd.github.v3+json' }
                });

                if (!res.ok) {
                    grid.innerHTML = '<p style="color:#888;">Nenhuma imagem</p>';
                    return;
                }

                var files = await res.json();
                var images = files.filter(function(f) { return f.name.match(/\.(jpg|jpeg|png|gif|webp)$/i); });

                if (images.length === 0) {
                    grid.innerHTML = '<p style="color:#888;">Nenhuma imagem</p>';
                    return;
                }

                // Ordena conforme a ordem salva no config.json
                var savedOrder = getImageOrderFromConfig();
                if (savedOrder.length > 0) {
                    images.sort(function(a, b) {
                        var orderA = savedOrder.indexOf(a.name);
                        var orderB = savedOrder.indexOf(b.name);
                        if (orderA === -1 && orderB === -1) return a.name.localeCompare(b.name);
                        if (orderA === -1) return 1;
                        if (orderB === -1) return -1;
                        return orderA - orderB;
                    });
                }

                imageOrder = images.map(function(img) { return img.name; });
                allCaseImages = images;
                renderGallery(images);
            } catch (e) {
                grid.innerHTML = '<p style="color:#888;">Erro</p>';
            }
        }

        // ==========================================
        // FUNÇÃO: getImageOrderFromConfig() - retorna a ordem salva no config
        // ==========================================
        function getImageOrderFromConfig() {
            if (!currentData.cases) return [];
            var caseData = currentData.cases.find(function(c) { return c.slug === selectedCase.slug; });
            if (caseData && caseData.imageOrder) return caseData.imageOrder;
            return [];
        }

        // ==========================================
        // FUNÇÃO: renderGallery() - desenha as miniaturas com botões ↑↓
        // ==========================================
        function renderGallery(images) {
            var grid = document.getElementById('galleryGrid');
            var saveBtn = document.getElementById('saveOrderBtn');
            
            var html = '';
            for (var i = 0; i < images.length; i++) {
                var img = images[i];
                var isFirst = (i === 0);
                var isLast = (i === images.length - 1);
                
                html += '<div class="gallery-item">';
                html += '<div class="gallery-number">' + (i + 1) + '</div>';
                html += '<img src="' + img.download_url + '" style="width:100%;height:150px;object-fit:cover;border-radius:4px;">';
                html += '<div class="gallery-info">';
                html += '<p style="color:#fff;font-size:12px;margin:8px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + img.name + '</p>';
                html += '<div style="display:flex;gap:5px;flex-wrap:wrap;">';
                
                // Botão subir (desabilitado na primeira imagem)
                if (isFirst) {
                    html += '<button style="padding:6px 10px;background:#333;color:#666;border:none;border-radius:4px;cursor:not-allowed;" disabled>↑</button>';
                } else {
                    html += '<button class="btn-secondary" style="padding:6px 10px;" onclick="moveImage(' + i + ',-1)">↑</button>';
                }
                
                // Botão descer (desabilitado na última imagem)
                if (isLast) {
                    html += '<button style="padding:6px 10px;background:#333;color:#666;border:none;border-radius:4px;cursor:not-allowed;" disabled>↓</button>';
                } else {
                    html += '<button class="btn-secondary" style="padding:6px 10px;" onclick="moveImage(' + i + ',1)">↓</button>';
                }
                
                // Botão remover
                html += '<button class="btn-danger" style="padding:6px 12px;font-size:11px;" onclick="deleteImage(\'' + img.path + '\',\'' + img.sha + '\')">Remover</button>';
                html += '</div></div></div>';
            }
            
            grid.innerHTML = html;
            saveBtn.style.display = 'block';
        }

        // ==========================================
        // FUNÇÃO: moveImage() - move uma imagem para cima ou para baixo
        // ==========================================
        function moveImage(fromIndex, direction) {
            var toIndex = fromIndex + direction;
            if (toIndex < 0 || toIndex >= imageOrder.length) return;
            
            // Troca as posições no array
            var temp = imageOrder[fromIndex];
            imageOrder[fromIndex] = imageOrder[toIndex];
            imageOrder[toIndex] = temp;
            
            // Reordena as imagens completas
            var reordered = [];
            for (var i = 0; i < imageOrder.length; i++) {
                for (var j = 0; j < allCaseImages.length; j++) {
                    if (allCaseImages[j].name === imageOrder[i]) {
                        reordered.push(allCaseImages[j]);
                        break;
                    }
                }
            }
            
            allCaseImages = reordered;
            renderGallery(reordered);
        }

        // ==========================================
        // FUNÇÃO: saveImageOrder() - salva a nova ordem no config.json
        // ==========================================
        async function saveImageOrder() {
            try {
                var caseIndex = currentData.cases.findIndex(function(c) { return c.slug === selectedCase.slug; });
                if (caseIndex === -1) {
                    showAlert('imagesAlert', 'Case não encontrado', 'error');
                    return;
                }
                
                currentData.cases[caseIndex].imageOrder = imageOrder;
                await saveConfig();
                showAlert('imagesAlert', '✅ Ordem salva!', 'success');
            } catch (error) {
                showAlert('imagesAlert', '❌ Erro: ' + error.message, 'error');
            }
        }

        // ==========================================
        // FUNÇÃO: deleteImage() - remove uma imagem do GitHub
        // ==========================================
        async function deleteImage(path, sha) {
            if (!confirm('Remover?')) return;
            var url = 'https://api.github.com/repos/' + config.username + '/' + config.repo + '/contents/' + path;

            var res = await fetch(url, {
                method: 'DELETE',
                headers: { 'Authorization': 'token ' + config.token, 'Accept': 'application/vnd.github.v3+json' },
                body: JSON.stringify({ message: 'Delete ' + path, sha: sha, branch: config.branch })
            });

            if (res.ok) {
                loadCaseImages();
                showAlert('imagesAlert', 'Imagem removida!', 'success');
            } else {
                showAlert('imagesAlert', 'Erro', 'error');
            }
        }

        // ==========================================
        // UPLOAD DE IMAGENS - eventos de clique e arrastar
        // ==========================================
        document.getElementById('uploadArea').addEventListener('click', function() {
            document.getElementById('fileInput').click();
        });

        document.getElementById('uploadArea').addEventListener('dragover', function(e) {
            e.preventDefault();
            this.style.borderColor = '#00d4ff';
        });

        document.getElementById('uploadArea').addEventListener('dragleave', function() {
            this.style.borderColor = '#333';
        });

        document.getElementById('uploadArea').addEventListener('drop', function(e) {
            e.preventDefault();
            this.style.borderColor = '#333';
            handleFiles(e.dataTransfer.files);
        });

        document.getElementById('fileInput').onchange = function(e) {
            handleFiles(e.target.files);
        };

        // ==========================================
        // FUNÇÃO: handleFiles() - mostra preview das imagens selecionadas
        // ==========================================
        function handleFiles(files) {
            filesToUpload = Array.from(files).filter(function(f) { return f.type.startsWith('image/'); });

            var preview = document.getElementById('imagePreview');
            preview.innerHTML = filesToUpload.map(function(f, i) {
                return '<div class="image-item"><img src="' + URL.createObjectURL(f) + '"><button onclick="removeFile(' + i + ')">×</button></div>';
            }).join('');

            document.getElementById('uploadBtn').style.display = filesToUpload.length > 0 ? 'inline-block' : 'none';
        }

        // ==========================================
        // FUNÇÃO: removeFile() - remove uma imagem do preview
        // ==========================================
        function removeFile(index) {
            filesToUpload.splice(index, 1);
            var preview = document.getElementById('imagePreview');
            preview.innerHTML = filesToUpload.map(function(f, i) {
                return '<div class="image-item"><img src="' + URL.createObjectURL(f) + '"><button onclick="removeFile(' + i + ')">×</button></div>';
            }).join('');
            document.getElementById('uploadBtn').style.display = filesToUpload.length > 0 ? 'inline-block' : 'none';
        }

        // ==========================================
        // FUNÇÃO: uploadImages() - envia as imagens para o GitHub
        // ==========================================
        async function uploadImages() {
            if (!selectedCase) {
                showAlert('imagesAlert', 'Selecione um case', 'error');
                return;
            }
            if (filesToUpload.length === 0) {
                showAlert('imagesAlert', 'Selecione arquivos', 'error');
                return;
            }

            showAlert('imagesAlert', 'Enviando...', 'success');

            for (var i = 0; i < filesToUpload.length; i++) {
                var file = filesToUpload[i];
                var path = selectedCase.folder + '/' + file.name;

                // Converte a imagem para base64
                var base64 = await new Promise(function(resolve) {
                    var reader = new FileReader();
                    reader.onload = function() { resolve(reader.result.split(',')[1]); };
                    reader.readAsDataURL(file);
                });

                // Envia para o GitHub
                var url = 'https://api.github.com/repos/' + config.username + '/' + config.repo + '/contents/' + path;
                await fetch(url, {
                    method: 'PUT',
                    headers: { 'Authorization': 'token ' + config.token, 'Accept': 'application/vnd.github.v3+json' },
                    body: JSON.stringify({ message: 'Upload ' + file.name, content: base64, branch: config.branch })
                });
            }

            filesToUpload = [];
            document.getElementById('imagePreview').innerHTML = '';
            document.getElementById('uploadBtn').style.display = 'none';
            loadCaseImages();
            showAlert('imagesAlert', 'Upload concluído!', 'success');
        }

        // ==========================================
        // FUNÇÃO: showAlert() - mostra mensagem temporária
        // ==========================================
        function showAlert(containerId, message, type) {
            var container = document.getElementById(containerId);
            container.innerHTML = '<div class="alert alert-' + type + '">' + message + '</div>';
            setTimeout(function() { container.innerHTML = ''; }, 5000);
        }

        // ==========================================
        // FUNÇÃO: viewCaseImages() - vai para a aba imagens com o case selecionado
        // ==========================================
        function viewCaseImages(index) {
            document.getElementById('caseSelect').value = index;
            selectedCase = currentData.cases[index];
            loadCaseImages();
            document.getElementById('caseSelect').scrollIntoView({ behavior: 'smooth' });
        }

        // ==========================================
        // FUNÇÃO: switchTab() - troca de aba
        // ==========================================
        function switchTab(tabName, btn) {
            document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
            document.querySelectorAll('.tab-content').forEach(function(t) { t.classList.remove('active'); });
            btn.classList.add('active');
            document.getElementById(tabName + 'Tab').classList.add('active');
        }
    </script>
</body>
</html>
