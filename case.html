<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Case — VDMTX</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --color-bg: #fafafa;
            --color-text: #1a1a1a;
            --color-text-light: #666666;
            --color-text-muted: #999999;
            --color-border: #e5e5e5;
            --color-accent: #2d3748;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: var(--color-bg);
            color: var(--color-text);
            font-weight: 300;
            line-height: 1.6;
        }
        
        /* Header */
        .back-link {
            position: fixed;
            top: 40px;
            left: 60px;
            font-size: 11px;
            letter-spacing: 0.1em;
            color: var(--color-text-light);
            text-decoration: none;
            transition: color 0.3s;
            z-index: 100;
        }
        
        .back-link:hover {
            color: var(--color-text);
        }
        
        /* Case Header */
        .case-header {
            padding: 120px 60px 60px;
            border-bottom: 1px solid var(--color-border);
        }
        
        .case-category {
            font-size: 10px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--color-text-muted);
            margin-bottom: 20px;
        }
        
        .case-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 56px;
            font-weight: 300;
            line-height: 1.1;
            margin-bottom: 30px;
            max-width: 800px;
        }
        
        .case-meta {
            display: flex;
            gap: 60px;
            margin-top: 40px;
        }
        
        .meta-item {
            font-size: 13px;
            color: var(--color-text-light);
        }
        
        .meta-item strong {
            display: block;
            font-size: 11px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--color-text-muted);
            margin-bottom: 8px;
            font-weight: 400;
        }
        
        /* Gallery */
        .gallery {
            padding: 80px 60px;
        }
        
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 30px;
            margin-top: 60px;
        }
        
        .gallery-item {
            position: relative;
            overflow: hidden;
            background: var(--color-border);
        }
        
        .gallery-item.full-width {
            grid-column: span 12;
        }
        
        .gallery-item.half-width {
            grid-column: span 6;
        }
        
        .gallery-item.third-width {
            grid-column: span 4;
        }
        
        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.6s ease;
        }
        
        .gallery-item:hover img {
            transform: scale(1.03);
        }
        
        .gallery-item figcaption {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 30px;
            background: linear-gradient(to top, rgba(0,0,0,0.7), transparent);
            color: #fff;
            font-size: 13px;
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .gallery-item:hover figcaption {
            opacity: 1;
        }
        
        /* Loading */
        .loading {
            text-align: center;
            padding: 100px;
            font-family: 'Cormorant Garamond', serif;
            font-size: 18px;
            color: var(--color-text-muted);
            font-style: italic;
        }
        
        /* Error */
        .error {
            text-align: center;
            padding: 100px;
            color: var(--color-text-light);
        }
        
        /* Responsive */
        @media (max-width: 1024px) {
            .gallery-item.half-width,
            .gallery-item.third-width {
                grid-column: span 6;
            }
        }
        
        @media (max-width: 768px) {
            .back-link {
                left: 30px;
                top: 30px;
            }
            
            .case-header {
                padding: 100px 30px 40px;
            }
            
            .case-title {
                font-size: 36px;
            }
            
            .case-meta {
                flex-direction: column;
                gap: 30px;
            }
            
            .gallery {
                padding: 60px 30px;
            }
            
            .gallery-grid {
                gap: 20px;
            }
            
            .gallery-item.full-width,
            .gallery-item.half-width,
            .gallery-item.third-width {
                grid-column: span 12;
            }
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-link">← Voltar ao portfólio</a>
    
    <header class="case-header">
        <div class="case-category" id="caseCategory">Loading...</div>
        <h1 class="case-title" id="caseTitle">Loading...</h1>
        
        <div class="case-meta">
            <div class="meta-item">
                <strong>Cliente</strong>
                <span id="caseClient">—</span>
            </div>
            <div class="meta-item">
                <strong>Ano</strong>
                <span id="caseYear">—</span>
            </div>
            <div class="meta-item">
                <strong>Serviços</strong>
                <span id="caseServices">—</span>
            </div>
        </div>
    </header>
    
    <main class="gallery">
        <div class="gallery-grid" id="galleryGrid">
            <div class="loading">Carregando imagens...</div>
        </div>
    </main>
    
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const slug = urlParams.get('slug');
        
        // Dados adicionais dos cases (pode ser expandido via config.json)
        const caseDetails = {
            'coisamaislinda': {
                client: 'Coisa Mais Linda',
                year: '2024',
                services: 'Visual Identity, Retail Strategy, Packaging'
            },
            'bombeirodeaco': {
                client: 'Corpo de Bombeiros TO',
                year: '2023',
                services: 'Institutional Branding, Medal Design, Event Materials'
            },
            'corridadofogo': {
                client: 'Prefeitura de Palmas',
                year: '2024',
                services: 'Event Branding, Tactical Wayfinding, Signage'
            },
            'protocantins': {
                client: 'Governo do Tocantins',
                year: '2023',
                services: 'Government Identity, Communication System'
            }
        };
        
        async function loadCase() {
            try {
                // Carregar config
                const configRes = await fetch('config.json');
                const config = await configRes.json();
                
                const caseData = config.cases.find(c => c.slug === slug);
                
                if (!caseData) {
                    showError();
                    return;
                }
                
                // Atualizar header
                document.getElementById('caseCategory').textContent = caseData.category;
                document.getElementById('caseTitle').textContent = caseData.title;
                
                // Atualizar meta informações
                const details = caseDetails[slug] || {};
                document.getElementById('caseClient').textContent = details.client || '—';
                document.getElementById('caseYear').textContent = details.year || '—';
                document.getElementById('caseServices').textContent = details.services || '—';
                
                // Carregar imagens
                await loadImages(caseData.folder);
                
                // Atualizar título da página
                document.title = `${caseData.title} — VDMTX`;
                
            } catch (error) {
                console.error('Erro:', error);
                showError();
            }
        }
        
        async function loadImages(folder) {
            const grid = document.getElementById('galleryGrid');
            
            try {
                const response = await fetch(`https://api.github.com/repos/vdmtx/art-director-portfolio/contents/${folder}`);
                
                if (!response.ok) {
                    grid.innerHTML = '<div class="error">Nenhuma imagem encontrada</div>';
                    return;
                }
                
                const files = await response.json();
                const images = files.filter(f => f.name.match(/\.(jpg|jpeg|png|gif|webp)$/i));
                
                if (images.length === 0) {
                    grid.innerHTML = '<div class="error">Nenhuma imagem encontrada</div>';
                    return;
                }
                
                // Sort images by name
                images.sort((a, b) => a.name.localeCompare(b.name));
                
                // Render gallery
                grid.innerHTML = images.map((img, index) => {
                    // Layout inteligente: primeira imagem full width, resto em grid
                    let widthClass = 'half-width';
                    if (index === 0) widthClass = 'full-width';
                    else if (index % 3 === 0) widthClass = 'full-width';
                    
                    return `
                        <figure class="gallery-item ${widthClass}">
                            <img src="${img.download_url}" alt="${img.name}" loading="lazy">
                            <figcaption>${img.name.replace(/\.[^/.]+$/, "")}</figcaption>
                        </figure>
                    `;
                }).join('');
                
            } catch (error) {
                console.error('Erro ao carregar imagens:', error);
                grid.innerHTML = '<div class="error">Erro ao carregar imagens</div>';
            }
        }
        
        function showError() {
            document.querySelector('.case-header').innerHTML = `
                <div class="error" style="padding: 100px 60px;">
                    <h1 style="font-family: 'Cormorant Garamond', serif; font-size: 48px; margin-bottom: 20px;">Case não encontrado</h1>
                    <p style="color: var(--color-text-light); margin-bottom: 40px;">O case solicitado não existe ou foi removido.</p>
                    <a href="index.html" style="display: inline-block; padding: 14px 28px; background: var(--color-accent); color: #fff; text-decoration: none; font-size: 11px; letter-spacing: 0.1em;">Voltar ao portfólio</a>
                </div>
            `;
            document.querySelector('.gallery').style.display = 'none';
        }
        
        // Inicializar
        document.addEventListener('DOMContentLoaded', loadCase);
    </script>
</body>
</html>
