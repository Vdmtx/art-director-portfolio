<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VDMTX — Art Director & Visual Strategist</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --color-bg: #fafafa;
            --color-text: #1a1a1a;
            --color-text-light: #666666;
            --color-text-muted: #999999;
            --color-border: #e5e5e5;
            --color-accent: #2d3748;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: var(--color-bg);
            color: var(--color-text);
            font-weight: 300;
            line-height: 1.6;
        }
        
        header {
            padding: 60px 80px 40px;
            border-bottom: 1px solid var(--color-border);
        }
        
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }
        
        .logo {
            font-family: 'Cormorant Garamond', serif;
            font-size: 32px;
            font-weight: 400;
            letter-spacing: 0.15em;
            color: var(--color-text);
            text-decoration: none;
            cursor: pointer;
        }
        
        .lang-switch {
            display: flex;
            gap: 25px;
            font-size: 14px;
            letter-spacing: 0.1em;
            color: var(--color-text-light);
        }
        
        .lang-switch a {
            color: var(--color-text-light);
            text-decoration: none;
            transition: all 0.3s;
            cursor: pointer;
        }
        
        .lang-switch a:hover,
        .lang-switch a.active {
            color: var(--color-text);
            font-weight: 500;
        }
        
        .cta-buttons {
            display: flex;
            gap: 20px;
            margin-bottom: 50px;
        }
        
        .btn {
            padding: 18px 36px;
            font-size: 13px;
            letter-spacing: 0.1em;
            text-decoration: none;
            transition: all 0.3s ease;
            cursor: pointer;
            border: 1px solid var(--color-text);
            display: inline-block;
            background: transparent;
        }
        
        .btn-primary {
            background: var(--color-accent);
            color: #fff;
            border-color: var(--color-accent);
        }
        
        .btn-primary:hover { background: var(--color-text); }
        
        .btn-secondary {
            color: var(--color-text);
        }
        
        .btn-secondary:hover {
            background: var(--color-text);
            color: #fff;
        }
        
        nav {
            display: flex;
            justify-content: center;
            gap: 50px;
            padding: 40px 0;
            flex-wrap: wrap;
        }
        
        nav a {
            font-family: 'Cormorant Garamond', serif;
            font-size: 16px;
            font-weight: 400;
            color: var(--color-text-light);
            text-decoration: none;
            letter-spacing: 0.05em;
            transition: color 0.3s;
        }
        
        nav a:hover { color: var(--color-text); }
        
        main {
            padding: 100px 80px;
        }
        
        .intro {
            max-width: 900px;
            margin-bottom: 120px;
        }
        
        .intro h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 64px;
            font-weight: 300;
            line-height: 1.1;
            margin-bottom: 30px;
        }
        
        .intro p {
            font-size: 18px;
            color: var(--color-text-light);
            line-height: 1.8;
        }
        
        section {
            margin-bottom: 120px;
        }
        
        .section-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 18px;
            font-weight: 500;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--color-text-muted);
            margin-bottom: 60px;
            padding-bottom: 25px;
            border-bottom: 1px solid var(--color-border);
        }
        
        .competencies-list {
            display: flex;
            flex-direction: column;
            gap: 60px;
        }
        
        .competency {
            padding-bottom: 60px;
            border-bottom: 1px solid var(--color-border);
        }
        
        .competency:last-child { border-bottom: none; }
        
        .competency h3 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 32px;
            font-weight: 400;
            margin-bottom: 20px;
        }
        
        .competency p {
            font-size: 16px;
            color: var(--color-text-light);
            line-height: 1.8;
            max-width: 800px;
        }
        
        .cases-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 50px;
        }
        
        .case-card {
            cursor: pointer;
            transition: transform 0.4s ease;
        }
        
        .case-card:hover { transform: translateY(-10px); }
        
        .case-image {
            width: 100%;
            aspect-ratio: 4/3;
            background: var(--color-border);
            margin-bottom: 25px;
            overflow: hidden;
        }
        
        .case-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .case-category {
            font-size: 12px;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--color-text-muted);
            margin-bottom: 12px;
        }
        
        .case-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 26px;
            font-weight: 400;
        }
        
        footer {
            padding: 80px;
            border-top: 1px solid var(--color-border);
            text-align: center;
        }
        
        footer p {
            font-size: 14px;
            color: var(--color-text-muted);
            letter-spacing: 0.1em;
        }
        
        .loading {
            font-family: 'Cormorant Garamond', serif;
            font-size: 20px;
            color: var(--color-text-muted);
            font-style: italic;
        }
        
        @media (max-width: 1024px) {
            .cases-grid { grid-template-columns: repeat(2, 1fr); }
        }
        
        @media (max-width: 768px) {
            header, main { padding-left: 40px; padding-right: 40px; }
            .intro h1 { font-size: 48px; }
            .cases-grid { grid-template-columns: 1fr; }
            nav { gap: 30px; }
            .header-top { flex-direction: column; gap: 30px; align-items: flex-start; }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-top">
            <span class="logo">VDMTX</span>
            <div class="lang-switch">
                <a data-lang="pt" class="active">PT</a>
                <a data-lang="en">EN</a>
                <a data-lang="jp">JP</a>
                <a data-lang="zh">ZH</a>
            </div>
        </div>
        
        <div class="cta-buttons">
            <a href="mailto:contact@vdmtx.com" class="btn btn-primary" data-i18n="consultBtn">Solicitar Consultoria</a>
            <a href="#" class="btn btn-secondary" data-i18n="linkedinBtn">Perfil Linkedin</a>
        </div>
        
        <nav id="navCases"></nav>
    </header>
    
    <main>
        <div class="intro">
            <h1 data-i18n="introTitle">Art Director & Visual Strategist</h1>
            <p data-i18n="introText">27 years of experience in high-stakes institutional branding and visual identity engineering.</p>
        </div>
        
        <section id="competencies">
            <div class="section-title" data-i18n="competenciesTitle">Core Competencies</div>
            <div class="competencies-list" id="competenciesList">
                <div class="loading">Loading...</div>
            </div>
        </section>
        
        <section id="cases">
            <div class="section-title" data-i18n="casesTitle">Selected Case Studies</div>
            <div class="cases-grid" id="casesGrid">
                <div class="loading">Loading...</div>
            </div>
        </section>
    </main>
    
    <footer>
        <p>
            <span data-i18n="footer">© 2024 VDMTX — All Rights Reserved</span>
            <span id="admin-trigger" style="opacity:0.02;cursor:default;font-size:12px;margin-left:8px;user-select:none;display:inline-block;width:10px;height:10px;" title="•">•</span>
        </p>
    </footer>

    <script>
        // Sistema de Tradução Completo
        const translations = {
            pt: {
                consultBtn: 'Solicitar Consultoria',
                linkedinBtn: 'Perfil Linkedin',
                introTitle: 'Diretor de Arte & Estrategista Visual',
                introText: '27 anos de experiência em branding institucional de alto impacto e engenharia de identidade visual.',
                competenciesTitle: 'Competências Principais',
                casesTitle: 'Cases Selecionados',
                footer: '© 2024 VDMTX — Todos os Direitos Reservados',
                // Categorias
                catVisualIdentity: 'Identidade Visual & Estratégia de Varejo',
                catInstitutional: 'Branding Institucional & Design de Medalhas',
                catEvent: 'Branding de Eventos & Wayfinding Tático',
                catGovernment: 'Identidade Governamental',
                // Cases - títulos
                caseCoisaMaisLinda: 'Coisa Mais Linda',
                caseBombeiroDeAco: 'Bombeiro de Aço',
                caseCorridaDoFogo: 'Corrida do Fogo',
                caseProTocantins: 'Pró-Tocantins',
                // Competências
                compVisualIdentity: 'Visual Identity Engineering',
                compVisualIdentityDesc: 'Brand design focused on longevity, scalability, and technical rigor. Building perennial visual assets for institutions that demand authority.',
                compInstitutional: 'Institutional Design Systems',
                compInstitutionalDesc: 'Visual identity management for government agencies and large corporations. Creation of manuals, guidelines, and design systems for multi-platform application.',
                compArchitectural: 'Architectural Signage & Wayfinding',
                compArchitecturalDesc: 'Facade projections (ACM), high-fidelity physical signage, fleet branding, and environmental design. Integration of graphic design into architectural space.'
            },
            en: {
                consultBtn: 'Request Consultation',
                linkedinBtn: 'LinkedIn Profile',
                introTitle: 'Art Director & Visual Strategist',
                introText: '27 years of experience in high-stakes institutional branding and visual identity engineering.',
                competenciesTitle: 'Core Competencies',
                casesTitle: 'Selected Case Studies',
                footer: '© 2024 VDMTX — All Rights Reserved',
                catVisualIdentity: 'Visual Identity & Retail Strategy',
                catInstitutional: 'Institutional Branding & Medal Design',
                catEvent: 'Event Branding & Tactical Wayfinding',
                catGovernment: 'Government Identity',
                caseCoisaMaisLinda: 'Coisa Mais Linda',
                caseBombeiroDeAco: 'Bombeiro de Aço',
                caseCorridaDoFogo: 'Corrida do Fogo',
                caseProTocantins: 'Pró-Tocantins',
                compVisualIdentity: 'Visual Identity Engineering',
                compVisualIdentityDesc: 'Brand design focused on longevity, scalability, and technical rigor. Building perennial visual assets for institutions that demand authority.',
                compInstitutional: 'Institutional Design Systems',
                compInstitutionalDesc: 'Visual identity management for government agencies and large corporations. Creation of manuals, guidelines, and design systems for multi-platform application.',
                compArchitectural: 'Architectural Signage & Wayfinding',
                compArchitecturalDesc: 'Facade projections (ACM), high-fidelity physical signage, fleet branding, and environmental design. Integration of graphic design into architectural space.'
            },
            jp: {
                consultBtn: 'コンサルティングを依頼',
                linkedinBtn: 'LinkedInプロフィール',
                introTitle: 'アートディレクター & ビジュアルストラテジスト',
                introText: 'ハイスケールのインスティテューショナル・ブランディングとビジュアルアイデンティティ・エンジニアリングにおいて27年の経験。',
                competenciesTitle: '主要な専門分野',
                casesTitle: '厳選されたケーススタディ',
                footer: '© 2024 VDMTX — All Rights Reserved',
                catVisualIdentity: 'ビジュアルアイデンティティ＆小売戦略',
                catInstitutional: '機関ブランディング＆メダルデザイン',
                catEvent: 'イベントブランディング＆タクティカルウェイファインディング',
                catGovernment: '政府アイデンティティ',
                caseCoisaMaisLinda: 'コイサ・マイス・リンダ',
                caseBombeiroDeAco: 'ボンベイロ・デ・アソ',
                caseCorridaDoFogo: 'コヒーダ・ド・フォゴ',
                caseProTocantins: 'プロ・トカンチンス',
                compVisualIdentity: 'ビジュアルアイデンティティ・エンジニアリング',
                compVisualIdentityDesc: '長寿性、拡張性、技術的厳密性に焦点を当てたブランドデザイン。権威を求める機関のための永続的なビジュアル資産を構築。',
                compInstitutional: 'インスティテューショナル・デザインシステム',
                compInstitutionalDesc: '政府機関および大企業のためのビジュアルアイデンティティ管理。マニュアル、ガイドライン、マルチプラットフォーム適用のためのデザインシステムの作成。',
                compArchitectural: 'アーキテクチュラル・サイネージ＆ウェイファインディング',
                compArchitecturalDesc: 'ファサード投影（ACM）、高忠実度物理サイネージ、フリートブランディング、環境デザイン。グラフィックデザインを建築空間に統合。'
            },
            zh: {
                consultBtn: '请求咨询',
                linkedinBtn: '领英档案',
                introTitle: '艺术总监与视觉策略师',
                introText: '拥有27年高端机构品牌塑造和视觉识别系统设计经验。',
                competenciesTitle: '核心能力',
                casesTitle: '精选案例研究',
                footer: '© 2024 VDMTX — All Rights Reserved',
                catVisualIdentity: '视觉识别与零售策略',
                catInstitutional: '机构品牌与奖章设计',
                catEvent: '活动品牌与战术导视系统',
                catGovernment: '政府形象识别',
                caseCoisaMaisLinda: 'Coisa Mais Linda',
                caseBombeiroDeAco: 'Bombeiro de Aço',
                caseCorridaDoFogo: 'Corrida do Fogo',
                caseProTocantins: 'Pró-Tocantins',
                compVisualIdentity: '视觉识别工程',
                compVisualIdentityDesc: '专注于持久性、可扩展性和技术严谨性的品牌设计。为要求权威性的机构打造持久的视觉资产。',
                compInstitutional: '机构设计系统',
                compInstitutionalDesc: '为政府机构和大型公司管理视觉识别。创建手册、指南和多平台应用的设计系统。',
                compArchitectural: '建筑标识与导视系统',
                compArchitecturalDesc: '立面投影（ACM）、高保真物理标识、车队品牌和环境设计。将平面设计融入建筑空间。'
            }
        };

        let currentLang = localStorage.getItem('lang') || 'pt';

        function setLanguage(lang) {
            if (!translations[lang]) lang = 'pt';
            currentLang = lang;
            localStorage.setItem('lang', lang);
            
            const t = translations[lang];
            
            // Traduz elementos com data-i18n
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (t[key]) {
                    el.textContent = t[key];
                }
            });
            
            // Atualiza categorias dos cases
            document.querySelectorAll('.case-category').forEach(el => {
                const catKey = el.dataset.category;
                if (catKey && t[catKey]) {
                    el.textContent = t[catKey];
                }
            });
            
            // Atualiza títulos dos cases
            document.querySelectorAll('.case-title').forEach(el => {
                const caseKey = el.dataset.case;
                if (caseKey && t[caseKey]) {
                    el.textContent = t[caseKey];
                }
            });
            
            // Atualiza competências
            updateCompetencies(t);
            
            // Atualiza estado ativo
            document.querySelectorAll('.lang-switch a').forEach(a => {
                a.classList.toggle('active', a.dataset.lang === lang);
            });
            
            document.documentElement.lang = lang === 'pt' ? 'pt-BR' : lang;
        }

        function updateCompetencies(t) {
            const container = document.getElementById('competenciesList');
            container.innerHTML = `
                <div class="competency">
                    <h3>${t.compVisualIdentity}</h3>
                    <p>${t.compVisualIdentityDesc}</p>
                </div>
                <div class="competency">
                    <h3>${t.compInstitutional}</h3>
                    <p>${t.compInstitutionalDesc}</p>
                </div>
                <div class="competency">
                    <h3>${t.compArchitectural}</h3>
                    <p>${t.compArchitecturalDesc}</p>
                </div>
            `;
        }

        async function loadData() {
            try {
                const response = await fetch('config.json');
                const data = await response.json();
                
                updateCompetencies(translations[currentLang]);
                await renderCases(data.cases);
                renderNav(data.cases);
                setLanguage(currentLang);
            } catch (error) {
                console.error('Erro:', error);
            }
        }

        function renderNav(cases) {
            document.getElementById('navCases').innerHTML = cases.map(c => `<a href="#${c.slug}">${c.title}</a>`).join('');
        }

        async function renderCases(cases) {
            const container = document.getElementById('casesGrid');
            
            const configRes = await fetch('config.json');
            const config = await configRes.json();
            
            const casesWithImages = await Promise.all(cases.map(async c => {
                let coverImage = null;
                
                try {
                    const res = await fetch(`https://api.github.com/repos/vdmtx/art-director-portfolio/contents/${c.folder}`);
                    if (res.ok) {
                        const files = await res.json();
                        let images = files.filter(f => f.name.match(/\.(jpg|jpeg|png|gif|webp)$/i));
                        
                        if (images.length > 0) {
                            const caseData = config.cases.find(caseItem => caseItem.slug === c.slug);
                            if (caseData && caseData.imageOrder && caseData.imageOrder.length > 0) {
                                images.sort((a, b) => {
                                    const orderA = caseData.imageOrder.indexOf(a.name);
                                    const orderB = caseData.imageOrder.indexOf(b.name);
                                    if (orderA === -1 && orderB === -1) return a.name.localeCompare(b.name);
                                    if (orderA === -1) return 1;
                                    if (orderB === -1) return -1;
                                    return orderA - orderB;
                                });
                            } else {
                                images.sort((a, b) => a.name.localeCompare(b.name));
                            }
                            
                            coverImage = images[0].download_url;
                        }
                    }
                } catch(e) {
                    console.log('Erro ao carregar imagens do case', c.slug, e);
                }
                
                // Mapeia slug para chave de tradução
                const caseKeyMap = {
                    'coisamaislinda': 'caseCoisaMaisLinda',
                    'bombeirodeaco': 'caseBombeiroDeAco',
                    'corridadofogo': 'caseCorridaDoFogo',
                    'protocantins': 'caseProTocantins'
                };
                
                const catKeyMap = {
                    'coisamaislinda': 'catVisualIdentity',
                    'bombeirodeaco': 'catInstitutional',
                    'corridadofogo': 'catEvent',
                    'protocantins': 'catGovernment'
                };
                
                return {
                    ...c, 
                    coverImage, 
                    caseKey: caseKeyMap[c.slug] || 'caseCoisaMaisLinda',
                    categoryKey: catKeyMap[c.slug] || 'catVisualIdentity'
                };
            }));
            
            container.innerHTML = casesWithImages.map(c => `
                <div class="case-card" onclick="openCase('${c.slug}')">
                    <div class="case-image">
                        ${c.coverImage ? `<img src="${c.coverImage}" alt="${c.title}">` : ''}
                    </div>
                    <div class="case-category" data-category="${c.categoryKey}">${translations[currentLang][c.categoryKey] || c.category}</div>
                    <div class="case-title" data-case="${c.caseKey}">${translations[currentLang][c.caseKey] || c.title}</div>
                </div>
            `).join('');
        }

        function openCase(slug) {
            window.location.href = `case.html?slug=${slug}`;
        }

        // Acesso admin
        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'a') {
                e.preventDefault();
                window.location.href = 'admin.html';
            }
        });

        document.addEventListener('click', (e) => {
            if (e.target.id === 'admin-trigger') {
                window.location.href = 'admin.html';
            }
        });

        document.querySelectorAll('.lang-switch a').forEach(a => {
            a.addEventListener('click', (e) => {
                e.preventDefault();
                setLanguage(a.dataset.lang);
            });
        });

        document.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
</html>
