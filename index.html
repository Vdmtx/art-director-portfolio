<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Art Director & Visual Strategist</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            line-height: 1.6;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 80px 20px;
        }
        h1 {
            font-size: 48px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 20px;
            letter-spacing: -1px;
        }
        h2 {
            font-size: 32px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 30px;
        }
        h3 {
            font-size: 24px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 15px;
        }
        .subtitle {
            font-size: 20px;
            color: #888;
            margin-bottom: 40px;
        }
        .cta-buttons {
            display: flex;
            gap: 20px;
            margin-bottom: 80px;
        }
        .cta-button {
            padding: 15px 30px;
            background: #00d4ff;
            color: #000;
            text-decoration: none;
            border-radius: 4px;
            font-weight: 600;
            transition: all 0.3s;
        }
        .cta-button:hover {
            background: #00b8e6;
            transform: translateY(-2px);
        }
        .cta-button.secondary {
            background: #222;
            color: #fff;
        }
        .cta-button.secondary:hover {
            background: #333;
        }
        .section {
            margin-bottom: 100px;
        }
        .competency {
            margin-bottom: 40px;
            padding-bottom: 40px;
            border-bottom: 1px solid #222;
        }
        .competency:last-child {
            border-bottom: none;
        }
        .cases-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }
        .case-card {
            background: #111;
            border: 1px solid #222;
            border-radius: 8px;
            overflow: hidden;
            transition: all 0.3s;
            cursor: pointer;
        }
        .case-card:hover {
            transform: translateY(-5px);
            border-color: #333;
        }
        .case-image {
            width: 100%;
            height: 250px;
            object-fit: cover;
            background: #1a1a1a;
        }
        .case-info {
            padding: 20px;
        }
        .case-category {
            color: #00d4ff;
            font-size: 14px;
            margin-bottom: 10px;
        }
        .case-title {
            color: #fff;
            font-size: 20px;
            font-weight: 600;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        .admin-link {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #222;
            color: #666;
            padding: 10px 15px;
            border-radius: 4px;
            text-decoration: none;
            font-size: 12px;
            opacity: 0;
            transition: opacity 0.3s;
        }
        body:hover .admin-link {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Art Director & Visual Strategist</h1>
        <p class="subtitle" id="experience">27 years of experience in high-stakes institutional branding and visual identity engineering.</p>
        
        <div class="cta-buttons">
            <a href="mailto:contact@example.com" class="cta-button">Request Consultation</a>
            <a href="https://linkedin.com" target="_blank" class="cta-button secondary">LinkedIn Profile</a>
            <a href="https://behance.net" target="_blank" class="cta-button secondary">Behance Portfolio</a>
        </div>

        <div class="section">
            <h2>Core Competencies</h2>
            <div id="competenciesList">
                <div class="loading">Loading...</div>
            </div>
        </div>

        <div class="section">
            <h2>Selected Case Studies</h2>
            <div class="cases-grid" id="casesList">
                <div class="loading">Loading...</div>
            </div>
        </div>
    </div>

    <a href="admin.html" class="admin-link">Admin</a>

    <script src="script.js"></script>
</body>
</html>
