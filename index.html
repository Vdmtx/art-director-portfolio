<script>
    // Acesso 1: Clique no ponto sutil do footer
    document.getElementById('admin-trigger').addEventListener('click', () => {
        window.location.href = 'admin.html';
    });

    // Acesso 2: Atalho de teclado (Ctrl + Shift + A)
    document.addEventListener('keydown', (e) => {
        if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'a') {
            window.location.href = 'admin.html';
        }
    });

    // Acesso 3: Sequência secreta (digite "vdmtx" no teclado)
    let secretSequence = [];
    document.addEventListener('keypress', (e) => {
        secretSequence.push(e.key.toLowerCase());
        if (secretSequence.length > 5) secretSequence.shift();
        if (secretSequence.join('') === 'vdmtx') {
            window.location.href = 'admin.html';
        }
    });
</script>
